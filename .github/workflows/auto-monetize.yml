name: 24/7 AI Autonomous Monetization Pipeline

# 2026-10-13 収益化に至らなかったため自動実行を停止（cron削除）。
# 再開する場合は docs/postmortem を読んでから、実測データ基盤を整えること。
on:
  workflow_dispatch: # 手動トリガーのみ（下記 if: false で実質無効）

permissions:
  contents: write

jobs:
  auto-monetize:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Autonomous Engine Pipeline
        run: npm run auto-engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

      - name: Auto-Commit & Push Updated Content & Analytics
        run: |
          git config --global user.name 'AI Autonomous Bot'
          git config --global user.email 'bot@auto-monetize.local'
          git add src/data/
          git status
          git diff-index --quiet HEAD || (git commit -m "auto: publish daily AI monetized content and update analytics" && git push origin main)
